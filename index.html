<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wassergenossenschaften Sulzberg</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="landing-container">
    <header class="landing-header">
      <h1>Wassergenossenschaften Sulzberg</h1>
    </header>

    <div class="coop-grid">
      <a href="kirchdorf/" class="coop-card">
        <img src="assets/LogoKirchdorf.png" alt="Kirchdorf" class="coop-logo">
        <h2>Kirchdorf</h2>
      </a>
      <a href="sonnenseite/" class="coop-card">
        <img src="assets/Sonnenseite/Logo Sonnenseite.png" alt="Sonnenseite" class="coop-logo" style="width: 110px;">
        <h2>Sonnenseite</h2>
      </a>
      <div class="coop-card disabled">
        <img src="assets/LogoHinterberg.png" alt="Hinterberg" class="coop-logo">
        <h2>Hinterberg</h2>
      </div>
      <div class="coop-card disabled">
        <span class="coop-icon">&#128167;</span>
        <h2>Thal</h2>
        <p class="coop-status">Demnächst</p>
      </div>
    </div>
  </div>
</body>
</html>
